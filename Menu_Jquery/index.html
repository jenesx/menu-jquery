<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nejx Dessert House</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css"/>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://img.icons8.com/?size=100&id=CMxKTlIFOaoi&format=png&color=000000" rel="dessert icon"/>
  <style>
    @font-face {
      font-family: 'Kingsman Demo';
      src: url('font/KingsmanDemo.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    .font-kingsman {
      font-family: 'Kingsman Demo', sans-serif;
    }
  </style>
</head>

<body class="bg-[#e4c6ff] min-h-screen flex flex-col">
  <nav class="border-[#cf1616] bg-[#510495] py-5 shadow-md" data-aos="fade-down">
    <div class="mx-auto flex max-w-screen-xl flex-wrap items-center justify-between px-4">
        <a href="#" class="flex items-center space-x-4">
            <img src="https://img.icons8.com/?size=100&id=rKu2K7cx9rG8&format=png&color=FFFFFF" alt="nejx icon" class="h-10 w-10">
          <span class="self-center text-2xl whitespace-nowrap text-white font-kingsman">Nejx Dessert House</span>
        </a>
      <button class="lg:hidden text-white focus:outline-none" id="menu-toggle">☰</button>
      <div class="hidden w-full lg:order-1 lg:flex lg:w-auto" id="mobile-menu-2">
        <ul class="mt-4 flex flex-col font-small lg:mt-0 lg:flex-row lg:space-x-8 text-xl">
          <li><a class="block py-2 pr-4 pl-3 text-white font-kingsman hover:text-yellow-500 font-kingsman lg:p-0" href="index.html">MENU</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="px-18 py-20 mx-auto max-w-screen-xl">
    <div class="mb-10 text-center">
      <h2 class="text-7xl text-white font-kingsman" data-aos="zoom-in">Look through our menu</h2>
      <p class="py-6 text-xl md:text-2xl italic text-white font-small font-kingsman max-w-5xl mx-auto" data-aos="zoom-in" data-aos-delay="100">Savory Flavors to look through:</p>
    </div>
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" id="menu-container"></div>

    <div class="flex justify-center px-4 mt-16 mb-10">
      <div class="bg-[#e4c6ff] border-2 border-[#510495] rounded-3xl bg-gradient-to-r from-[#510495] via-[#e4c6ff] to-[#510495] shadow-2xl shadow-[#8707f9] p-6 w-full max-w-sm text-center">
        <h2 class="text-4xl font-kingsman mb-4">Your Receipt</h2>
        <ul id="receiptItems" class="mb-4 space-y-2 text-left"></ul>
        <p class="text-2xl italic font-kingsman">Total: ₱<span id="receiptTotal">0</span></p>

        <input id="amountInput" type="number" placeholder="Enter amount here" class="mt-4 w-full px-4 py-2 font-kingsman text-xl border border-white rounded-2xl focus:outline-none focus:ring-2 focus:ring-[#510495]" />

        <button id="payBtn" class="mt-4 px-4 py-2 bg-black text-white text-large font-kingsman rounded-2xl hover:bg-[#e4c6ff] w-full">Pay!</button>
      </div>
    </div>
  </section>

  <script>
    $(document).ready(function () {
      AOS.init();

      const menuItems = [
        { name: "Fried Ice Cream Sundae", price: 180, img: "https://i.pinimg.com/originals/7f/b3/55/7fb3550ed8ab9ce4b05a37705f9b9e59.jpg" },
        { name: "Skillet Cookie Sundae", price: 240, img: "https://www.kowalskis.com/sites/default/files/styles/meta/public/2024-06/cookie-skillet-sundae.jpg?itok=gI-qKSB8" },
        { name: "Nutella Crepes", price: 280, img: "https://www.rachelcarr.com/wp-content/uploads/2020/09/nutella_strawberry_crepes_2000px-1-scaled.jpg" },
        { name: "Chocolate Panna Cotta", price: 180, img: "https://emmaduckworthbakes.com/wp-content/uploads/2022/10/Chocolate-Panna-Cotta-Italian-Dessert.jpg" },
        { name: "Mocha Mug Cake", price: 180, img: "https://hips.hearstapps.com/hmg-prod/images/mocha-mug0cake-1602177122.jpg?crop=0.8521859819569744xw:1xh;center,top&resize=1200:*https://hips.hearstapps.com/hmg-prod/images/mocha-mug0cake-1602177122.jpg?crop=0.8521859819569744xw:1xh;center,top&resize=1200:*" },
        { name: "Chocolate Lava Cake", price: 270, img: "https://www.recipetineats.com/tachyon/2021/02/Chocolate-Lava-Cake_7-SQ.jpg?resize=500%2C500" },
        { name: "Red Velvet Cake", price: 240, img: "https://thescranline.com/wp-content/uploads/2023/06/RED-VELVET-CAKE-23-S-01.jpg" },
        { name: "Strawberry Pretzel Salad", price: 230, img: "https://www.mybakingaddiction.com/wp-content/uploads/2012/03/plated-slice-strawberry-pretzel-salad-hero.jpg" },
        { name: "Cholate Donut Combo", price: 170, img: "https://scontent.fmnl30-3.fna.fbcdn.net/v/t1.6435-9/49555865_2473512842662385_5516991139317547008_n.jpg?stp=dst-jpg_s640x640_tt6&_nc_cat=101&ccb=1-7&_nc_sid=127cfc&_nc_ohc=UtkkabQDXXkQ7kNvwGEID2M&_nc_oc=AdmknAG7bDVCnMCfPGnSwItVkv7v8loo8hzYKbu3QvjshWVyxyasZU8FJcHCLf5ypJE&_nc_zt=23&_nc_ht=scontent.fmnl30-3.fna&_nc_gid=1h_I0O5eYsiHSbvlEeZhVg&oh=00_AfFsS3Ka2R7mR0znXm0-6nBiSlnnhBm-0lrXC2oIwVTYSg&oe=683BD344" },
        { name: "Jelly Donut Combo", price: 170, img: "https://cheflindseyfarr.com/wp-content/uploads/2021/09/stuffed-donuts-scaled.jpg" },
        { name: "Strawberry Milkshake", price: 120, img: "https://assets.epicurious.com/photos/647df8cad9749492c4d5d407/4:3/w_4886,h_3664,c_limit/StrawberryMilkshake_RECIPE_053123_3599.jpg" },
        { name: "Vanilla Milkshake", price: 120, img: "https://www.allrecipes.com/thmb/Qd8R0_0oOotU9rjJjTcRhKcCSKc=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/AR-238627-Vanilla-Milkshakes-without-Ice-Cream-DDMFS-4x3-68c7af8ca6714848a5e4c904996152e3.jpg" }
      ];

      $.each(menuItems, function (index, item) {
        $('#menu-container').append(`
          <div class="bg-[#510495] rounded-3xl shadow-2xl shadow-[#8707f9] overflow-hidden">
            <img src="${item.img}" class="w-full h-60 object-cover" alt="${item.name}">
            <div class="p-4">
              <h2 class="text-2xl text-[#e5d7f2] font-kingsman mb-2">${item.name}</h2>
              <p class="italic text-lg text-[#e5d7f2] font-kingsman mb-8">₱${item.price}</p>
              <button class="orderBtn px-6 py-2 bg-black text-white rounded-2xl hover:bg-[#8707f9]" data-name="${item.name}" data-price="${item.price}">Order</button>
            </div>
          </div>
        `);
      });

      $('#menu-toggle').click(function () {
        $('#mobile-menu-2').toggleClass('hidden');
      });

      let total = 0;

      $(document).on('click', '.orderBtn', function () {
        const name = $(this).data('name');
        const price = parseFloat($(this).data('price'));

        $('#receiptItems').append(`<li class="flex justify-between border-b pb-1 italic text-sm">${name} - ₱${price}</li>`);
        total += price;
        $('#receiptTotal').text(total);
      });

      $('#payBtn').click(function () {
        const enteredAmount = parseFloat($('#amountInput').val());

        if (isNaN(enteredAmount)) {
          alert("Please enter a valid amount.");
        } else if (enteredAmount < total) {
          alert(`Insufficient amount. You need ₱${total - enteredAmount} more.`);
        } else {
          const change = enteredAmount - total;
          alert(`Payment successful! Change: ₱${change}`);
          $('#receiptItems').empty();
          $('#receiptTotal').text(0);
          $('#amountInput').val('');
          total = 0;
        }
      });
    });
  </script>
</body>
</html>
